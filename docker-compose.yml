services:
  rag-api:
    build: .
    image: rag-service:local
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      INDEX_DIR: /app/data/indexes
      DATABASE_URL: sqlite:////app/data/metadata.db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rag_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
volumes:
  rag_data:
